<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flower Serenade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; position: fixed; inset: 0; touch-action: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; background: transparent; }

  /* ---------- Intro overlay ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; padding: 40px 28px; text-align: center;
    background: radial-gradient(circle at 50% 45%, rgba(60,90,130,0.25), rgba(20,30,45,0.45) 70%);
    transition: opacity 1s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }

  #title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(54px, 16vw, 92px);
    font-weight: 400; letter-spacing: 0.02em; line-height: 1.1;
    background: linear-gradient(90deg, #bcd6ff, #ffffff, #f3d6ec);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #subtitle {
    font-size: clamp(12px, 3.4vw, 15px);
    font-weight: 300; letter-spacing: 0.34em;
    color: rgba(190,210,235,0.7); text-transform: uppercase;
  }
  #desc {
    max-width: 300px; font-size: 13px; line-height: 1.9;
    font-weight: 300; letter-spacing: 0.05em;
    color: rgba(200,215,235,0.55); margin-top: 6px;
  }
  #startBtn {
    margin-top: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(180,205,235,0.5);
    color: rgba(220,232,250,0.95);
    font-family: inherit; font-size: 13px;
    letter-spacing: 0.24em; text-transform: uppercase;
    padding: 15px 34px; border-radius: 40px;
    cursor: pointer; transition: all 0.4s ease;
    backdrop-filter: blur(4px);
  }
  #startBtn:hover, #startBtn:active { background: rgba(180,205,235,0.14); }
  #startBtn:disabled { opacity: 0.5; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; inset: 0; z-index: 10;
    pointer-events: none; opacity: 0;
    transition: opacity 1.2s ease;
  }
  #hud.show { opacity: 1; }

  #progressWrap {
    position: fixed; top: 26px; left: 50%;
    transform: translateX(-50%);
    width: min(260px, 70vw);
    display: flex; flex-direction: column; align-items: center; gap: 9px;
  }
  #progressTrack {
    width: 100%; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,0.12); overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #8fbaff, #ffffff);
    border-radius: 3px; transition: background 1.5s ease;
  }
  #phaseLabel {
    font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase;
    color: rgba(210,224,245,0.7); transition: color 1.5s ease;
  }

  #backBtn {
    display: none;
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    background: rgba(40,110,220,0.85);
    border: 1px solid rgba(120,180,255,0.9);
    color: #ffffff;
    font-family: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase;
    padding: 11px 26px; border-radius: 40px;
    cursor: pointer; transition: all 0.3s ease;
    box-shadow: 0 0 16px rgba(60,140,255,0.55);
    backdrop-filter: blur(4px);
  }
  #backBtn:hover, #backBtn:active { background: rgba(60,140,255,0.95); box-shadow: 0 0 22px rgba(90,160,255,0.8); }
  #backBtn.show { display: block; }

  #volMeter {
    position: fixed; bottom: 54px; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 2px; border-radius: 2px;
    background: rgba(255,255,255,0.1); overflow: hidden;
  }
  #volFill {
    height: 100%; width: 0%;
    background: rgba(200,220,250,0.8);
    transition: width 0.06s linear, background 1.5s ease;
  }

  #finalMsg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Great Vibes', cursive;
    font-size: clamp(27px, 7.7vw, 46px);
    color: rgba(220, 100, 140, 0.95);
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(255,150,180,0.6);
    z-index: 15;
  }
  #finalMsg.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <div id="progressWrap">
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div id="phaseLabel">Phase I &mdash; Geometry</div>
  </div>
  <div id="volMeter"><div id="volFill"></div></div>
  <button id="backBtn">&larr; Back</button>
  <div id="finalMsg"></div>
</div>

<div id="intro">
  <div id="title">Flower Serenade</div>
  <div id="subtitle">A voice reactive bloom</div>
  <div id="desc">Geometry awakens to your voice and slowly transforms into a field of blossoming flowers.</div>
  <button id="startBtn">Enable Microphone</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const intro = document.getElementById('intro');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const progressFill = document.getElementById('progressFill');
const phaseLabel = document.getElementById('phaseLabel');
const backBtn = document.getElementById('backBtn');
const volFill = document.getElementById('volFill');

let W, H, cx, cy, DPR;
let audioCtx;
let analyser, dataArray;
let volume = 0, smoothVolume = 0;
let progress = 0;        // 0..1, accumulated voice energy
let morph = 0;           // 0 = geometry, 1 = flower
let isRunning = false;
let sceneActive = false;
let finalStarted = false;
let particles = [];
let fallingPetals = [];
const MAX_PARTICLES = 13;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2; cy = H / 2;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

// ---------- helpers ----------
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpHue(a, b, t) {
  let d = ((b - a + 540) % 360) - 180;
  return (a + d * t + 360) % 360;
}

// ---------- particle ----------
let bornCount = 0;
let lastBorn = 0;
const APPEAR_MS = 300;                  // 0.3s soft scale-up on birth

function makeParticle(index) {
  const sidesPool = [3, 4, 6];          // triangle, diamond, hexagon
  const cold = Math.random();
  let coldH, coldS, coldL;
  if (cold < 0.5) { coldH = rand(195, 222); coldS = rand(45, 70); coldL = rand(62, 80); } // blue
  else            { coldH = rand(195, 215); coldS = rand(0, 16);  coldL = rand(80, 93); } // silver / white

  const warm = Math.random();
  let warmH, warmS, warmL;
  if (warm < 0.28)      { warmH = rand(330, 345); warmS = rand(78, 92); warmL = rand(60, 70); } // deep pink
  else if (warm < 0.48) { warmH = rand(6, 18);    warmS = rand(82, 94); warmL = rand(64, 73); } // coral
  else if (warm < 0.68) { warmH = rand(262, 282); warmS = rand(52, 70); warmL = rand(66, 76); } // wisteria (fuji)
  else if (warm < 0.86) { warmH = rand(196, 210); warmS = rand(70, 88); warmL = rand(66, 77); } // sky blue
  else                  { warmH = rand(118, 145); warmS = rand(52, 70); warmL = rand(60, 72); } // green

  // bloom outward one by one: golden-angle spiral so each new flower lands
  // further from the center than the last
  const golden = 2.399963229728653;
  const ang = index * golden + rand(-0.18, 0.18);
  const rad = Math.sqrt(index) * Math.min(W, H) * 0.092;
  const hx = cx + Math.cos(ang) * rad;
  const hy = cy + Math.sin(ang) * rad * 1.12;

  return {
    idx: index, ang: ang,
    homeX: hx, homeY: hy,
    x: cx, y: cy,                       // every flower is born at the center
    born: performance.now(),
    vx: 0, vy: 0,
    size: rand(15, 56),
    rot: rand(0, Math.PI * 2),
    rotSpeed: rand(-0.011, 0.011),
    sides: sidesPool[Math.floor(Math.random() * sidesPool.length)],
    petals: [5, 6, 8][Math.floor(Math.random() * 3)],
    alpha: rand(0.45, 0.85),
    coldH, coldS, coldL, warmH, warmS, warmL,
    spin: rand(0.4, 2.1),
    disp: rand(0.5, 1.2)
  };
}

function shapeRadius(theta, sides, petals, m) {
  // regular polygon radius (normalized, vertex = 1)
  const a = ((theta % (Math.PI * 2 / sides)) + Math.PI * 2) % (Math.PI * 2 / sides);
  const poly = Math.cos(Math.PI / sides) / Math.cos(a - Math.PI / sides);

  // organic flower petal radius: distinct rounded petals with a soft notch at
  // each tip and a deep valley between petals, so it reads as real petals
  const lobe = Math.abs(Math.sin(petals * theta / 2));     // 0 (valley) .. 1 (tip)
  const rounded = Math.pow(lobe, 0.5);                      // fatter, rounder petals
  const tipNotch = 0.06 * Math.pow(lobe, 6);               // tiny dip at the very tip
  const petal = 0.22 + 0.86 * rounded - tipNotch;          // 0.22 valley .. ~1.02 tip
  return poly * (1 - m) + petal * m;
}

function drawParticle(p) {
  // 0.3s soft scale-up when the flower is first born
  const appear = smoothstep(0, APPEAR_MS, performance.now() - p.born);
  const R = p.size * (1 + morph * 0.55) * (0.82 + smoothVolume * 0.55) * appear;
  if (R < 0.4) return;
  const h = lerpHue(p.coldH, p.warmH, morph);
  const s = lerp(p.coldS, p.warmS, morph);
  const l = lerp(p.coldL, p.warmL, morph);
  const a = clamp(p.alpha * (0.45 + smoothVolume * 0.6), 0, 0.95);

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);

  const steps = 64;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const th = (i / steps) * Math.PI * 2;
    const r = shapeRadius(th, p.sides, p.petals, morph) * R;
    const x = Math.cos(th) * r;
    const y = Math.sin(th) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  ctx.shadowColor = `hsla(${h},${clamp(s + 10, 0, 100)}%,${clamp(l + 6, 0, 100)}%,0.85)`;
  ctx.shadowBlur = 30 + morph * 34 + smoothVolume * 30;

  // soft petal shading: lighter heart fading into a richer petal edge
  const grad = ctx.createRadialGradient(0, 0, R * 0.04, 0, 0, R);
  grad.addColorStop(0, `hsla(${h},${clamp(s - 18, 0, 100)}%,${clamp(l + 12, 0, 96)}%,${a})`);
  grad.addColorStop(0.55, `hsla(${h},${s}%,${l}%,${a})`);
  grad.addColorStop(1, `hsla(${lerpHue(h, h - 8, morph)},${clamp(s + 12, 0, 100)}%,${clamp(l - 12, 0, 100)}%,${a * 0.92})`);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
  ctx.strokeStyle = `hsla(${h},${clamp(s - 8, 0, 100)}%,${clamp(l - 22, 0, 100)}%,${a * 0.4})`;
  ctx.stroke();

  // warm yellow flower heart — always drawn
  const heartR = R * (0.12 + morph * 0.14);
  ctx.shadowColor = 'hsla(48,95%,68%,0.9)';
  ctx.shadowBlur = 18 + morph * 16;
  ctx.beginPath();
  ctx.arc(0, 0, heartR, 0, Math.PI * 2);
  ctx.fillStyle = `hsla(48,92%,66%,${a})`;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ---------- gently falling petals (after full bloom) ----------
function makeFallingPetal() {
  const palette = [
    [336, 84, 66], [12, 88, 70], [272, 60, 72], [203, 78, 72], [132, 60, 66]
  ];
  const c = palette[Math.floor(Math.random() * palette.length)];
  return {
    x: rand(0, W), y: rand(-40, -10),
    size: rand(4, 11),
    speedY: rand(0.35, 0.95),
    speedX: rand(-0.25, 0.25),
    rot: rand(0, Math.PI * 2),
    rotSpeed: rand(-0.02, 0.02),
    sway: rand(0, Math.PI * 2),
    swaySpeed: rand(0.005, 0.014),
    h: c[0], s: c[1], l: c[2],
    alpha: rand(0.4, 0.8)
  };
}

function drawFallingPetal(p) {
  p.sway += p.swaySpeed;
  p.x += p.speedX + Math.sin(p.sway) * 0.6;
  p.y += p.speedY;
  p.rot += p.rotSpeed;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.beginPath();
  ctx.moveTo(0, -p.size / 2);
  ctx.bezierCurveTo(p.size * 0.45, -p.size * 0.3, p.size * 0.5, p.size * 0.25, 0, p.size * 0.6);
  ctx.bezierCurveTo(-p.size * 0.5, p.size * 0.25, -p.size * 0.45, -p.size * 0.3, 0, -p.size / 2);
  ctx.shadowColor = `hsla(${p.h},${p.s}%,${p.l}%,0.7)`;
  ctx.shadowBlur = 8;
  ctx.fillStyle = `hsla(${p.h},${p.s}%,${p.l}%,${p.alpha})`;
  ctx.fill();
  ctx.restore();
}

function updateParticle(p) {
  // geometry stays compact (original layout); flowers spread out 3x as they bloom
  const spacing = lerp(0.092, 0.2208, morph);
  const rad = Math.sqrt(p.idx) * Math.min(W, H) * spacing;
  p.homeX = cx + Math.cos(p.ang) * rad;
  p.homeY = cy + Math.sin(p.ang) * rad * 1.12;

  // spring toward home
  const dx = p.homeX - p.x, dy = p.homeY - p.y;
  p.vx += dx * 0.0022;
  p.vy += dy * 0.0022;

  // outward dispersion driven by voice (split / diffuse)
  const ox = p.x - cx, oy = p.y - cy;
  const dist = Math.hypot(ox, oy) || 1;
  const push = smoothVolume * p.disp * 0.9;
  p.vx += (ox / dist) * push;
  p.vy += (oy / dist) * push;

  p.vx *= 0.93; p.vy *= 0.93;
  p.x += p.vx; p.y += p.vy;

  p.rot += p.rotSpeed * p.spin * (1 + smoothVolume * 9);
}

// ---------- scene control ----------
function resetScene() {
  progress = 0; morph = 0;
  particles = []; fallingPetals = [];
  finalStarted = false; lastPhase = 1;
  bornCount = 0; lastBorn = 0;
  phaseLabel.innerHTML = 'Phase I &mdash; Geometry';
  phaseLabel.style.color = '';
  progressFill.style.background = 'linear-gradient(90deg, #8fbaff, #ffffff)';
  progressFill.style.width = '0%';
  volFill.style.background = '';
  const fm = document.getElementById('finalMsg');
  fm.classList.remove('show'); fm.textContent = '';
  backBtn.classList.remove('show');
  ctx.clearRect(0, 0, W, H);
}

function beginScene() {
  resetScene();
  particles.push(makeParticle(bornCount++));   // first flower at the center
  sceneActive = true;
  intro.classList.add('hide');
  hud.classList.add('show');
}

// ---------- audio ----------
startBtn.addEventListener('click', async () => {
  if (isRunning) { beginScene(); return; }   // returning from Back — just resume
  startBtn.disabled = true;
  startBtn.textContent = 'Connecting...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.82;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    isRunning = true;
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Again';
    beginScene();
    loop();
  } catch (e) {
    startBtn.disabled = false;
    startBtn.textContent = 'Microphone blocked — tap to retry';
  }
});

// ---------- back to the first screen ----------
backBtn.addEventListener('click', () => {
  sceneActive = false;
  hud.classList.remove('show');
  intro.classList.remove('hide');
  resetScene();
});

function getVolume() {
  analyser.getByteFrequencyData(dataArray);
  const binHz = (audioCtx.sampleRate / 2) / dataArray.length;
  const voiceLow  = Math.floor(85  / binHz);
  const voiceHigh = Math.ceil(255 / binHz);
  let sum = 0;
  for (let i = voiceLow; i <= voiceHigh; i++) sum += dataArray[i];
  const avg = sum / (voiceHigh - voiceLow + 1) / 255;
  return avg;
}

let lastPhase = 1;
function loop() {
  requestAnimationFrame(loop);

  // transparent background — clear each frame
  ctx.clearRect(0, 0, W, H);
  if (!analyser) return;

  volume = getVolume();
  smoothVolume += (volume - smoothVolume) * 0.22;

  if (sceneActive) {
    // accumulate voice energy into progress
    progress = clamp(progress + smoothVolume * 0.0024, 0, 1);
    // smooth 2-3s style transition centered around the 50% mark
    morph = smoothstep(0.5, 0.78, progress);

    // HUD
    progressFill.style.width = (progress * 100).toFixed(1) + '%';
    volFill.style.width = Math.min(smoothVolume * 320, 100) + '%';

    // full bloom: reveal the closing message once, typed one letter at a time
    if (progress >= 1 && !finalStarted) {
      finalStarted = true;
      const finalMsg = document.getElementById('finalMsg');
      finalMsg.classList.add('show');
      const text = 'The flowers sway and fall';
      let i = 0;
      const typer = setInterval(() => {
        finalMsg.textContent = text.slice(0, i + 1);
        i++;
        if (i >= text.length) clearInterval(typer);
      }, 180);
    }

    if (morph > 0.5 && lastPhase === 1) {
      lastPhase = 2;
      phaseLabel.innerHTML = 'Phase II &mdash; Bloom';
      phaseLabel.style.color = 'rgba(255,210,225,0.85)';
      progressFill.style.background = 'linear-gradient(90deg, #ffb6cf, #fff3c4)';
      volFill.style.background = 'rgba(255,200,220,0.85)';
      backBtn.classList.add('show');           // only in the flower scene
    } else if (morph <= 0.5 && lastPhase === 2) {
      lastPhase = 1;
      phaseLabel.innerHTML = 'Phase I &mdash; Geometry';
      phaseLabel.style.color = '';
      progressFill.style.background = 'linear-gradient(90deg, #8fbaff, #ffffff)';
      volFill.style.background = '';
      backBtn.classList.remove('show');
    }

    // one flower at a time: each new voice burst gives birth to a single bloom
    const now = performance.now();
    if (smoothVolume > 0.16 && particles.length < MAX_PARTICLES && now - lastBorn > 360) {
      lastBorn = now;
      particles.push(makeParticle(bornCount++));
    }
  }

  for (const p of particles) {
    updateParticle(p);
    drawParticle(p);
  }

  // after the closing message, small petals drift slowly down from the top
  if (sceneActive && finalStarted) {
    if (fallingPetals.length < 70 && Math.random() < 0.12) {
      fallingPetals.push(makeFallingPetal());
    }
    for (const fp of fallingPetals) drawFallingPetal(fp);
    fallingPetals = fallingPetals.filter(fp => fp.y < H + 30);
  }
}
</script>
</body>
</html>
